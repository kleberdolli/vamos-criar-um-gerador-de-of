<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Oficio</title>
    <style>
:root {
  --ink: #20242c;
  --muted: #687080;
  --line: #d8dde7;
  --paper: #ffffff;
  --panel: #f7f8fb;
  --accent: #126d63;
  --accent-dark: #0d514a;
  --soft: #e8f4f2;
  --warn: #a85d1e;
  --shadow: 0 18px 50px rgba(20, 28, 40, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: #edf0f5;
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  padding: 20px;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(320px, 440px) 1fr;
  gap: 20px;
  max-width: 1440px;
  margin: 0 auto;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.controls {
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 40px);
  overflow: auto;
  padding: 18px;
}

.brand {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: 1.6rem;
  letter-spacing: 0;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-bottom: 16px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.tab,
.secondary,
.primary,
.icon-button {
  border: 1px solid transparent;
  border-radius: 6px;
  min-height: 40px;
  cursor: pointer;
}

.tab {
  color: var(--muted);
  background: transparent;
  font-weight: 700;
}

.tab.active {
  color: var(--accent-dark);
  background: var(--soft);
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

.hidden-fields {
  display: none;
}

.field {
  display: grid;
  gap: 7px;
  margin-bottom: 14px;
}

.field span {
  color: #3a4250;
  font-size: 0.88rem;
  font-weight: 700;
}

.official-header-note {
  display: grid;
  grid-template-columns: 52px 1fr 52px;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
  padding: 10px;
  border: 1px solid #cbd2dd;
  border-radius: 8px;
  background: #fff;
}

.official-header-note img {
  width: 52px;
  height: 52px;
  object-fit: contain;
}

.official-header-note strong,
.official-header-note span {
  display: block;
}

.official-header-note strong {
  margin-bottom: 2px;
  font-size: 0.92rem;
}

.official-header-note span {
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.3;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #cbd2dd;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  padding: 10px 11px;
  outline: none;
}

textarea {
  resize: vertical;
  line-height: 1.45;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(18, 109, 99, 0.14);
}

.two-column {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.actions,
.page-tools,
.quick-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.quick-actions {
  position: sticky;
  top: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 10px 0;
  background: var(--panel);
}

.primary,
.secondary {
  padding: 0 14px;
  font-weight: 700;
}

.primary {
  color: #fff;
  background: var(--accent);
}

.primary:hover {
  background: var(--accent-dark);
}

.secondary {
  color: var(--accent-dark);
  border-color: #b8cbc8;
  background: #fff;
}

.icon-button {
  width: 42px;
  color: #fff;
  background: var(--accent);
  font-weight: 800;
}

.preview-shell {
  min-width: 0;
}

.page-tools {
  justify-content: flex-end;
}

.paper {
  width: min(100%, 820px);
  min-height: 1120px;
  margin: 0 auto;
  padding: 34px 62px;
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  font-size: 11pt;
  line-height: 1.45;
}

.doc-header {
  display: grid;
  grid-template-columns: 125px 1fr 125px;
  gap: 10px;
  align-items: center;
  min-height: 120px;
  padding-bottom: 4px;
  border-bottom: 1px solid #222;
  text-align: center;
}

.official-logo {
  width: 118px;
  height: 118px;
  object-fit: contain;
}

.official-logo.crest {
  width: 124px;
  height: 124px;
}

.official-logo.education {
  width: 124px;
  height: 124px;
  border-radius: 50%;
}

.header-copy {
  display: grid;
  gap: 0;
  justify-items: center;
  line-height: 1;
}

.header-copy strong {
  font-size: 7pt;
  text-transform: uppercase;
}

.header-copy span {
  font-size: 7pt;
  font-weight: 700;
  text-transform: uppercase;
}

.header-copy small {
  color: #30343a;
  font-size: 6.5pt;
  font-weight: 700;
}

.doc-meta {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-top: 22px;
}

.recipient {
  margin-top: 30px;
  margin-bottom: 0;
  font-weight: 700;
}

.recipient-role {
  margin-top: 0;
  margin-bottom: 0;
}

.recipient-sector {
  margin-top: 0;
}

.subject {
  margin-top: 24px;
}

.doc-body {
  min-height: 360px;
  white-space: pre-line;
  text-align: justify;
}

.signature {
  display: grid;
  justify-items: center;
  gap: 2px;
  margin-top: 54px;
  text-align: center;
}

.signature-line {
  width: 260px;
  border-top: 1px solid var(--ink);
  margin-bottom: 8px;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  max-width: 320px;
  padding: 12px 14px;
  border-radius: 6px;
  color: #fff;
  background: var(--accent-dark);
  box-shadow: var(--shadow);
}

@media (max-width: 980px) {
  .workspace {
    grid-template-columns: 1fr;
  }

  .controls {
    position: static;
    max-height: none;
  }
}

@media (max-width: 640px) {
  .app-shell {
    padding: 10px;
  }

  .two-column,
  .doc-meta {
    grid-template-columns: 1fr;
  }

  .paper {
    min-height: 0;
    padding: 28px 18px;
  }

  .page-tools {
    justify-content: stretch;
  }

  .page-tools button,
  .actions button,
  .quick-actions button {
    flex: 1;
  }
}

@page {
  margin: 6mm 10mm 10mm;
}

@media print {
  body {
    background: #fff;
  }

  .controls,
  .page-tools {
    display: none;
  }

  .app-shell,
  .workspace {
    display: block;
    padding: 0;
    margin: 0;
  }

  .paper {
    width: auto;
    min-height: auto;
    margin: 0;
    border: 0;
    box-shadow: none;
    padding: 0 18mm 18mm;
  }

}

/* Cabeçalho de imagem única */
.doc-header.image-header {
  display: block;
  min-height: 0;
  padding: 0 0 8px;
  border-bottom: 1px solid #222;
}

.header-image {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}
</style>

            <div class="doc-meta">
              <p id="letterNumberPreview"></p>
              <p id="placeDatePreview"></p>
            </div>
            <p class="recipient" id="recipientPreview"></p>
            <p class="recipient-role" id="recipientRolePreview"></p>
            <p class="recipient-sector" id="recipientSectorPreview"></p>
            <p class="subject"><strong>Assunto:</strong> <span id="subjectPreview"></span></p>
            <p id="salutationPreview"></p>
            <div class="doc-body" id="bodyPreview"></div>
            <footer class="signature">
              <div class="signature-line"></div>
              <strong id="signerPreview"></strong>
              <span id="signerRolePreview"></span>
            </footer>

      </section>
    </main>
    <script>
const fields = {
  institution: document.querySelector("#institution"),
  department: document.querySelector("#department"),
  headerLine: document.querySelector("#headerLine"),
  contactLine: document.querySelector("#contactLine"),
  letterNumber: document.querySelector("#letterNumber"),
  placeDate: document.querySelector("#placeDate"),
  recipient: document.querySelector("#recipient"),
  recipientRole: document.querySelector("#recipientRole"),
  recipientSector: document.querySelector("#recipientSector"),
  subject: document.querySelector("#subject"),
  salutation: document.querySelector("#salutation"),
  tone: document.querySelector("#tone"),
  purpose: document.querySelector("#purpose"),
  details: document.querySelector("#details"),
  bodyText: document.querySelector("#bodyText"),
  signer: document.querySelector("#signer"),
  signerRole: document.querySelector("#signerRole"),
};

const previews = {
  institution: document.querySelector("#institutionPreview"),
  department: document.querySelector("#departmentPreview"),
  headerLine: document.querySelector("#headerLinePreview"),
  contactLine: document.querySelector("#contactLinePreview"),
  letterNumber: document.querySelector("#letterNumberPreview"),
  placeDate: document.querySelector("#placeDatePreview"),
  recipient: document.querySelector("#recipientPreview"),
  recipientRole: document.querySelector("#recipientRolePreview"),
  recipientSector: document.querySelector("#recipientSectorPreview"),
  subject: document.querySelector("#subjectPreview"),
  salutation: document.querySelector("#salutationPreview"),
  body: document.querySelector("#bodyPreview"),
  signer: document.querySelector("#signerPreview"),
  signerRole: document.querySelector("#signerRolePreview"),
};

function sanitize(text) {
  return String(text || "").trim();
}

function lowerFirst(text) {
  const clean = sanitize(text);
  return clean ? `${clean.charAt(0).toLowerCase()}${clean.slice(1)}` : "";
}

function generateBody() {
  const purpose = sanitize(fields.purpose.value);
  const details = sanitize(fields.details.value);
  const subject = sanitize(fields.subject.value).toLowerCase();
  const tone = fields.tone.value;

  const openings = {
    formal: "Vimos, por meio deste, encaminhar a presente comunicacao referente ao assunto em epigrafe.",
    objetivo: "Encaminhamos este oficio para tratar do assunto indicado acima.",
    cordial: "Cumprimentando-o(a) cordialmente, apresentamos a presente solicitacao referente ao assunto mencionado.",
  };

  const closings = {
    formal: "Sendo o que se apresenta para o momento, renovamos votos de elevada estima e consideracao.",
    objetivo: "Sem mais para o momento, aguardamos retorno para os encaminhamentos necessarios.",
    cordial: "Agradecemos desde ja a atencao dispensada e permanecemos a disposicao para quaisquer esclarecimentos.",
  };

  const firstParagraph = openings[tone];
  const secondParagraph = purpose
    ? `Solicitamos, nesse sentido, ${lowerFirst(purpose)}`
    : `Solicitamos as providencias cabiveis relacionadas a ${subject || "demanda apresentada"}.`;
  const thirdParagraph = details
    ? `Ressaltamos que ${lowerFirst(details)}`
    : "Colocamo-nos a disposicao para complementar as informacoes que se fizerem necessarias.";

  fields.bodyText.value = `${firstParagraph}\n\n${secondParagraph}\n\n${thirdParagraph}\n\n${closings[tone]}`;
  updatePreview();
  showToast("Corpo do oficio gerado.");
}

function updatePreview() {
  if (previews.institution) previews.institution.textContent = sanitize(fields.institution.value);
  if (previews.department) previews.department.textContent = sanitize(fields.department.value);
  if (previews.headerLine) previews.headerLine.textContent = sanitize(fields.headerLine.value);
  if (previews.contactLine) previews.contactLine.textContent = sanitize(fields.contactLine.value);
  previews.letterNumber.textContent = `Of\u00edcio n\u00ba ${sanitize(fields.letterNumber.value)}`;
  previews.placeDate.textContent = sanitize(fields.placeDate.value);
  previews.recipient.textContent = sanitize(fields.recipient.value);
  previews.recipientRole.textContent = sanitize(fields.recipientRole.value);
  previews.recipientSector.textContent = sanitize(fields.recipientSector.value);
  previews.subject.textContent = sanitize(fields.subject.value);
  previews.salutation.textContent = sanitize(fields.salutation.value);
  previews.body.textContent = sanitize(fields.bodyText.value);
  previews.signer.textContent = sanitize(fields.signer.value);
  previews.signerRole.textContent = sanitize(fields.signerRole.value);
}

function startBlank() {
  Object.values(fields).forEach((field) => {
    if (field.type !== "hidden" && field.tagName !== "SELECT") {
      field.value = "";
    }
  });
  fields.salutation.value = "Senhor(a),";
  fields.tone.value = "formal";
  updatePreview();
}

function showToast(message) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();

  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  document.body.append(toast);
  window.setTimeout(() => toast.remove(), 2600);
}

function getPlainText() {
  return [
    previews.institution.textContent,
    previews.department.textContent,
    previews.headerLine.textContent,
    previews.contactLine.textContent,
    "",
    previews.letterNumber.textContent,
    previews.placeDate.textContent,
    "",
    previews.recipient.textContent,
    previews.recipientRole.textContent,
    previews.recipientSector.textContent,
    "",
    `Assunto: ${previews.subject.textContent}`,
    "",
    previews.salutation.textContent,
    "",
    previews.body.textContent,
    "",
    previews.signer.textContent,
    previews.signerRole.textContent,
  ].join("\n");
}



document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.remove("active"));
    tab.classList.add("active");
    document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add("active");
  });
});

Object.values(fields).forEach((field) => {
  field.addEventListener("input", () => {
    updatePreview();
  });
});

document.querySelector("#generateButton").addEventListener("click", generateBody);
document.querySelector("#clearDataButton").addEventListener("click", () => {
  [
    fields.letterNumber,
    fields.placeDate,
    fields.recipient,
    fields.recipientRole,
    fields.recipientSector,
    fields.signer,
    fields.signerRole,
  ].forEach((field) => {
    field.value = "";
  });
  updatePreview();
  showToast("Dados limpos.");
});
document.querySelector("#clearBodyButton").addEventListener("click", () => {
  fields.bodyText.value = "";
  updatePreview();
});
document.querySelector("#printButton").addEventListener("click", () => window.print());
document.querySelector("#copyTopButton").addEventListener("click", copyText);
document.querySelector("#printTopButton").addEventListener("click", () => window.print());
document.querySelector("#pdfTopButton").addEventListener("click", () => window.print());
document.querySelector("#printPageButton").addEventListener("click", () => window.print());
document.querySelector("#pdfButton").addEventListener("click", () => window.print());
document.querySelector("#copyButton").addEventListener("click", copyText);

async function copyText() {
  await navigator.clipboard.writeText(getPlainText());
  showToast("Texto copiado.");
}

startBlank();

</script>
  </body>
</html>
